{% extends 'base.html' %}

{% block content %}
    {% if form.errors %}
        {% for field in form %}
            {% for error in field.errors %}
                {{ error }}
            {% endfor %}
        {% endfor %}
    {% endif %}
    <form method="POST">
        {% csrf_token %}
        {{ register_form }}
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
{% endblock %}
