<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Blog App{% endblock %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #333;
      color: white;
      padding: 10px 20px;
      margin-bottom: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header nav a {
      color: white;
      margin-right: 15px;
      text-decoration: none;
      font-weight: bold;
    }
    header nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #777;
      font-size: 14px;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <h1><a href="{% url 'blog:article_list' %}" style="color: inherit; text-decoration: none;">Blog Home</a></h1>
    <nav>
      <a href="{% url 'blog:article_list' %}">All Articles</a>
      {% if user.is_authenticated %}
        <a href="{% url 'blog:article_create' %}">Write New</a>
        <span style="margin-left:10px;">Hi, {{ user.username }}</span> |
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Sign Up</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; {{ now|date:"Y" }} Blog App
  </footer>
</body>
</html>
