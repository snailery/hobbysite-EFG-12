<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Blog App{% endblock %}</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      background: #fffefa;
      color: #222;
      line-height: 1.5;
    }
    header {
      margin-bottom: 30px;
      border-bottom: 2px solid #666;
      padding-bottom: 10px;
    }
    nav a {
      margin-right: 12px;
      color: #246;
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 60px;
      border-top: 1px solid #ddd;
      text-align: center;
      color: #555;
      font-size: 0.9em;
      padding-top: 10px;
    }
    main {
      min-height: 60vh;
    }
    button {
      background-color: #246;
      border: none;
      padding: 8px 16px;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
    }
    button:hover {
      background-color: #134;
    }
    input, select, textarea {
      font-size: 1em;
      padding: 8px;
      width: 100%;
      max-width: 600px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-bottom: 18px;
      box-sizing: border-box;
      font-family: inherit;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <h1><a href="{% url 'article_list' %}" style="color: inherit; text-decoration: none;">Blog Home</a></h1>
    <nav>
      <a href="{% url 'article_list' %}">All Articles</a>
      {% if user.is_authenticated %}
        <a href="{% url 'article_create' %}">Write New</a>
        <span style="margin-left:10px;">Hi, {{ user.username }}</span> |
        <a href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Sign Up</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; {{ now|date:"Y" }} Blog App
  </footer>
</body>
</html>
