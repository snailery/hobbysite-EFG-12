{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Edit Article</h1>

    <div class="card p-4 shadow-sm">
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ article.get_absolute_url }}" class="btn btn-secondary ml-2">Back</a>
        </form>
    </div>
</div>
{% endblock %}
