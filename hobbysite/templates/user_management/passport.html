{% extends 'base.html' %}

{% block content %}
  <h1>Profile - WIP</h1>
  <div class="d-flex justify-content-center">
    <div class="card shadow-sm p-10 w-50">
      <label for="username" class="form-label">Username</label>
      <div class="input-group mb-5">
        <input type="text" class="form-control form-control-solid" value="{{ user.username }}" id="username" disabled />
      </div>
      <label for="display_name" class="form-label">Display Name</label>
      <div class="input-group mb-5">
        <input type="text" class="form-control form-control-solid" value="{{ profile.display_name }}" id="display_name" disabled />
      </div>
      <label for="email" class="form-label">Email</label>
      <div class="position-relative">
        <div class="position-absolute translate-middle-y top-50 start-0 ms-4">
          <i class="ki-solid ki-sms fs-2">
            <span class="path1"></span>
            <span class="path2"></span>
          </i>
        </div>
        <input type="text" class="form-control form-control-solid ps-12" value="{{ user.email }}" id="email" disabled />
      </div>
    </div>

  </div>
  
{% endblock %}
